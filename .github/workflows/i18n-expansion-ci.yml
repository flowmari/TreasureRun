name: i18n-expansion-ci
on:
  push:
    branches: [ main, fix/** ]
    paths:
      - 'src/main/resources/lang-map.yml'
      - 'src/main/resources/languages/**'
      - 'fabric-i18n-mod/**'
      - 'resourcepacks/local-generator-policy.json'
      - 'scripts/check_minecraft_packet_coverage.py'
      - 'scripts/check_fabric_lang_mapping.py'
  pull_request:
jobs:
  i18n-expansion:
    name: i18n-owned-source-and-local-pack-policy-integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyyaml
      - name: Verify 23-language map and V4 17/6 client-pack policy
        run: python3 scripts/check_fabric_lang_mapping.py
      - name: Verify TreasureRun-owned packet YAML coverage
        run: python3 scripts/check_minecraft_packet_coverage.py
      - name: Verify YAML syntax
        run: python3 scripts/check_i18n_yaml_syntax.py
      - name: Verify no duplicate YAML keys
        run: python3 scripts/check_yaml_duplicate_keys.py
      - name: Verify lang-map.yml and allowedLanguages stay in sync
        run: |
          python3 - <<'PY2'
          import yaml
          from pathlib import Path
          mapped = set(yaml.safe_load(Path('src/main/resources/lang-map.yml').read_text()).get('mappings', {}))
          allowed = set(yaml.safe_load(Path('src/main/resources/config.yml').read_text()).get('language', {}).get('allowedLanguages', []))
          assert mapped == allowed, f'map_only={sorted(mapped-allowed)} config_only={sorted(allowed-mapped)}'
          print(f'PASS: {len(mapped)} plugin-side languages remain in sync.')
          PY2
      - name: Verify no tracked Minecraft language payloads
        run: python3 scripts/check_local_resourcepack_contract.py
