name: resourcepack-local-generator-contract

on:
  pull_request:
    paths:
      - 'resourcepacks/local-generator-policy.json'
      - 'tools/client-resourcepack/build-local-official-language-pack.py'
      - 'scripts/check_local_resourcepack_contract.py'
      - 'scripts/generate_fallback_resourcepacks.py'
      - 'scripts/check_fallback_resourcepack_generation.py'
      - '.github/workflows/fallback-resourcepack-reproducible-build-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-local-only-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify repository contains no distributable Minecraft language payloads
        run: python scripts/check_local_resourcepack_contract.py
      - name: Compile local-only generator scripts
        run: python -m py_compile tools/client-resourcepack/build-local-official-language-pack.py scripts/check_local_resourcepack_contract.py
