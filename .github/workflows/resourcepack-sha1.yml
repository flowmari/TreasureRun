name: resourcepack-delivery-disabled-contract

on:
  pull_request:
    paths:
      - '.github/workflows/resourcepack-sha1.yml'
      - '.gitignore'
      - 'resourcepacks/local-generator-policy.json'
      - 'resourcepacks/treasurerun-i18n-pack/**'
      - 'resourcepacks/client-custom-languages/**'
      - 'fabric-i18n-mod/src/main/resources/assets/minecraft/lang/**'
      - 'fabric-i18n-mod/src/main/resources/resourcepacks/treasurerun_langs/assets/minecraft/lang/**'
      - 'scripts/check_local_resourcepack_contract.py'
      - 'tools/client-resourcepack/build-local-official-language-pack.py'
      - 'src/main/resources/config.yml'
      - 'src/test/java/plugin/ResourcePackDeliveryBoundaryTest.java'
      - 'src/test/java/plugin/i18n/ResourcePackArtifactIntegrityTest.java'
      - 'src/test/java/plugin/i18n/ResourcePackExactKeySetConsistencyTest.java'
      - 'src/test/java/plugin/i18n/LanguageCodeMappingIntegrityTest.java'
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/resourcepack-sha1.yml'
      - 'resourcepacks/local-generator-policy.json'
      - 'scripts/check_local_resourcepack_contract.py'
      - 'src/main/resources/config.yml'

permissions:
  contents: read

jobs:
  verify-disabled-delivery-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify local-only ResourcePack repository contract
        run: python scripts/check_local_resourcepack_contract.py
      - name: Verify Java delivery boundary tests
        run: |
          ./gradlew :test --no-daemon \
            --tests plugin.ResourcePackDeliveryBoundaryTest \
            --tests plugin.i18n.ResourcePackArtifactIntegrityTest \
            --tests plugin.i18n.ResourcePackExactKeySetConsistencyTest \
            --tests plugin.i18n.LanguageCodeMappingIntegrityTest
